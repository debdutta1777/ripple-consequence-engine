services:
  - type: web
    name: ripple-consequence-engine
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: ENABLE_LIVE
        value: "false"
      - key: MAX_LIVE_ANALYSES
        value: "30"
