name: One-shot fresh policy PDFs (production /try and authenticated Clocked)
on:
  push:
    branches: [try-live-proof-20261110]
    paths:
      - .github/workflows/verify-try-live.yml
      - scripts/verify_try_live.py
      - scripts/pdf_diagnostics.py
permissions:
  contents: read
concurrency:
  group: ripple-one-shot-fresh-pdfs
  cancel-in-progress: false
jobs:
  verify:
    name: Upload production PDFs, compare actual Clocked results
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tested source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install runtime requirements
        run: python -m pip install -r requirements.txt
      - name: Verify production PDF upload and real authenticated Clocked integration
        env:
          CLOCKED_API_KEY: ${{ secrets.CLOCKED_API_KEY }}
          RIPPLE_BASE_URL: https://ripple-consequence-engine.vercel.app
        run: python -m scripts.verify_try_live
      - name: Archive fictional PDF evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ripple-fresh-policy-live-proof
          path: try-live-proof/
          retention-days: 7
