name: Real Clocked PDF highlight verification (one shot)
on:
  push:
    branches: [clocked-pdf-proof-20261110]
    paths:
      - .github/workflows/verify-clocked-pdf.yml
permissions:
  contents: read
concurrency:
  group: ripple-clocked-pdf-proof-once
  cancel-in-progress: false
jobs:
  native-pdf-proof:
    name: Clocked Compare PDF highlights
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated verification branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pinned Clocked SDK and PDF dependencies
        run: python -m pip install -r requirements.txt
      - name: Run one authenticated Compare request against fictional policy PDFs
        env:
          CLOCKED_API_KEY: ${{ secrets.CLOCKED_API_KEY }}
        run: python -m scripts.verify_clocked_pdf
      - name: Archive real marked PDF proof
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ripple-real-clocked-pdf-proof
          path: pdf-proof-output/
          retention-days: 7
